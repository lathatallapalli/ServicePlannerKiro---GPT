<app-menu-bar />
@if (!isHomePage() && !isTransactionsPage() && !isQuickViewPage() && !isBookingCategoriesPage()) {
  <app-action-ribbon [items]="visibleActionRibbonItems()" />
}
<div class="app-body">
  <app-stepper [hidden]="isHomePage() || isTransactionsPage() || isTransactionSummaryPage() || isServicePlannerPage() || isQuickViewPage() || isResourceEditorPage() || isResourceCatalogPage() || isBookingCategoriesPage()" />
  <div class="app-content">
    @if (!isHomePage() && !isTransactionsPage() && !isTransactionSummaryPage()) {
      <div class="app-content__header">
        <app-page-title
          [title]="shellTitle()"
          [referenceInfo]="shellReference()"
          [breadcrumbs]="shellBreadcrumbs()"
        />
        <app-top-panel [hidden]="isFullServicePlannerPage() || isResourceEditorPage() || isResourceCatalogPage() || isBookingCategoriesPage()" [tiles]="topPanelTiles" />
      </div>
    }
    <router-outlet />
  </div>
</div>
@if (!isHomePage()) {
  <app-footer
    [subpageMode]="isTransactionsPage() || isServicePlannerPage() || isQuickViewPage() || isResourceEditorPage() || isResourceCatalogPage() || isBookingCategoriesPage()"
    [hideSubpagePrimaryAction]="isTransactionsOfferPage() || isServicePlannerPage()"
    (pauseWorkflow)="onPause()"
    (previousTask)="onPrevious()"
    (nextTask)="onNext()"
    (closeSubpage)="onCloseSubpage()"
    (saveAndCloseSubpage)="onSaveAndCloseSubpage()"
  />
}
